[package]
name = "crate-cli"
version.workspace = true
readme.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
exclude.workspace = true
description = """A command-line tool for managing Cargo package lifecycles: version bump, workspace dependency sync, members-ordered publish and code formatting."""
keywords = ["cargo", "workspace", "publish", "semver", "cli"]
categories = ["command-line-interface", "development-tools"]

[[bin]]
name = "crate"
path = "src/main.rs"

[dependencies]
color-output = { workspace = true }
lombok-macros = { workspace = true }

log = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
which = { workspace = true }
