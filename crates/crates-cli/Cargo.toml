[package]
name = "crates-cli"
version = "0.1.0"
readme.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"
repository.workspace = true
exclude.workspace = true
description = """A command-line tool for managing Cargo package lifecycles: version bump, workspace dependency sync, members-ordered publish and code formatting."""
keywords = ["cargo", "workspace", "publish", "semver", "cli"]
categories = ["command-line-interface", "development-tools"]

[[bin]]
name = "cc"
path = "src/main.rs"

[dependencies]
log = "0.4.34"
toml = "0.9.8"
toml_edit = "0.25.15"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
which = "8.0.6"
thiserror = "2.0.21"
color-output = "10.0.10"
lombok-macros = "2.1.0"
