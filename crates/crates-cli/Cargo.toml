[package]
name = "crates-cli"
version = "0.1.0"
readme.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"
repository.workspace = true
exclude.workspace = true
description = """A command-line tool for managing Cargo package lifecycles: version bump, workspace dependency sync, members-ordered publish and code formatting."""
keywords = ["cargo", "workspace", "publish", "semver", "cli"]
categories = ["command-line-interface", "development-tools"]

[[bin]]
name = "cc"
path = "src/main.rs"

[dependencies]
color-output = { workspace = true }
lombok-macros = { workspace = true }

log = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
which = { workspace = true }

