[workspace.package]
version = "10.2.4"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["root@ltpp.vip"]
repository = "https://github.com/crates-dev/ctares"
exclude = [
    "**/*.log",
    "**/*.pid",
    ".github",
    "Cargo.lock",
    "debug",
    "img",
    "logs",
    "sh",
    "target",
    "uploads",
]

[workspace]
resolver = "2"
members = [
    "bin-encode-decode",
    "china_identification_card",
    "clonelicious",
    "compare-version",
    "file-operation",
    "future-fn",
    "hot-restart",
    "instrument-level",
    "lombok-macros",
    "jwt-service",
    "recoverable-spawn",
    "server-manager",
    "std-macro-extensions",
    "tcp-request",
    "tcplane",
    "udp",
    "udp-request",
    "chunkify",
    "recoverable-thread-pool",
    "system-time",
    "color-output",
    "crate-cli",
    "color-log",
    "tokio-broadcast",
    "stripe-pay-core",
    "stripe-pay-server",
    "stripe-pay-client",
]

[workspace.dependencies]
system-time = { path = "system-time", version = "10.2.4" }
color-output = { path = "color-output", version = "10.2.4" }
lombok-macros = { path = "lombok-macros", version = "10.2.4" }
file-operation = { path = "file-operation", version = "10.2.4" }
stripe-pay-core = { path = "stripe-pay-core", version = "10.2.4" }
tokio-broadcast = { path = "tokio-broadcast", version = "10.2.4" }
recoverable-spawn = { path = "recoverable-spawn", version = "10.2.4" }
stripe-pay-client = { path = "stripe-pay-client", version = "10.2.4" }
stripe-pay-server = { path = "stripe-pay-server", version = "10.2.4" }

hex = "0.4.3"
syn = "3.0.6"
log = "0.4.34"
toml = "0.9.8"
hmac = "0.13.0"
sha2 = "0.11.0"
which = "8.0.6"
quote = "1.0.47"
regex = "1.13.1"
chrono = "0.4.45"
dashmap = "6.2.1"
js-sys = "0.3.106"
tracing = "0.1.44"
twox-hash = "2.1.4"
once_cell = "1.21.4"
thiserror = "2.0.21"
toml_edit = "0.25.15"
serde_json = "1.0.151"
proc-macro2 = "1.0.107"
rust_decimal = "1.43.0"
wasm-bindgen = "0.2.129"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.79"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"
