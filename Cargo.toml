[workspace.package]
version = "10.1.7"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["root@ltpp.vip"]
repository = "https://github.com/crates-dev/ctares"
exclude = [
    "**/*.log",
    "**/*.pid",
    ".github",
    "Cargo.lock",
    "debug",
    "img",
    "logs",
    "sh",
    "target",
    "uploads",
]

[workspace]
resolver = "2"
members = [
    "bin-encode-decode",
    "china_identification_card",
    "clonelicious",
    "color-output",
    "compare-version",
    "file-operation",
    "future-fn",
    "gtl",
    "hot-restart",
    "instrument-level",
    "jwt-service",
    "lombok-macros",
    "recoverable-spawn",
    "server-manager",
    "std-macro-extensions",
    "tcp-request",
    "tcplane",
    "udp",
    "udp-request",
    "chunkify",
    "crate-cli",
    "recoverable-thread-pool",
]

[workspace.dependencies]
color-output = { path = "color-output", version = "10.1.7" }
lombok-macros = { path = "lombok-macros", version = "10.1.7" }
file-operation = { path = "file-operation", version = "10.1.7" }
recoverable-spawn = { path = "recoverable-spawn", version = "10.1.7" }

log = "0.4.34"
toml = "0.9.8"
syn = "2.0.119"
which = "8.0.6"
quote = "1.0.47"
regex = "1.13.1"
chrono = "0.4.44"
dashmap = "6.2.1"
tracing = "0.1.44"
twox-hash = "2.1.3"
once_cell = "1.21.4"
thiserror = "2.0.21"
toml_edit = "0.25.15"
serde_json = "1.0.151"
proc-macro2 = "1.0.107"
hyperlane-time = "0.7.46"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"
